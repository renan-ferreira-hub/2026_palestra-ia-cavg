<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 590" width="1400" height="590" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Como a IA generativa produz uma resposta</title>
  <defs>
    <style>
      .caixa { stroke-width: 3; }
      .t { font-size: 28px; font-weight: 700; fill: #1F2937; text-anchor: middle; }
      .n { font-size: 22px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .seta { stroke: #4B5563; stroke-width: 3.5; fill: none; }
      .laco { stroke: #4B5563; stroke-width: 3.5; fill: none; stroke-dasharray: 12 9; }
      .rot { font-size: 26px; font-weight: 700; fill: #374151; text-anchor: middle; }
      .fim { font-size: 24px; font-weight: 700; font-style: italic; fill: #2E7D4F; text-anchor: middle; }
      .leg { font-size: 22px; fill: #374151; }
    </style>
    <marker id="seta" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L18,7 L0,14 z" fill="#4B5563"/>
    </marker>
  </defs>

  <!-- Fundo branco -->
  <rect width="1400" height="590" fill="#FFFFFF"/>

  <!-- Setas -->
  <path class="seta" d="M 306 105 H 368" marker-end="url(#seta)"/>
  <path class="seta" d="M 666 105 H 728" marker-end="url(#seta)"/>
  <path class="seta" d="M 1026 105 H 1088" marker-end="url(#seta)"/>
  <path class="seta" d="M 1240 166 V 278" marker-end="url(#seta)"/>
  <path class="seta" d="M 1094 345 H 1032" marker-end="url(#seta)"/>
  <path class="seta" d="M 734 345 H 672" marker-end="url(#seta)"/>

  <!-- Laço: o token escolhido volta ao contexto -->
  <path class="laco" d="M 880 406 V 440 Q 880 470 850 470 H 190 Q 160 470 160 440 V 172" marker-end="url(#seta)"/>
  <text class="rot" x="520" y="512">adiciona o token ao contexto e repete</text>
  <text class="fim" x="700" y="330">fim</text>

  <!-- Linha de cima -->
  <rect class="caixa" x="20"   y="50" width="280" height="110" rx="18" fill="#E8F0FE" stroke="#4A78C2"/>
  <text class="t" x="160"  y="95">Prompt</text>
  <text class="t" x="160"  y="129">+ contexto</text>

  <rect class="caixa" x="380"  y="50" width="280" height="110" rx="18" fill="#E8F0FE" stroke="#4A78C2"/>
  <text class="t" x="520"  y="115">Tokens</text>

  <rect class="caixa" x="740"  y="50" width="280" height="110" rx="18" fill="#E8F0FE" stroke="#4A78C2"/>
  <text class="t" x="880"  y="95">Representações</text>
  <text class="t" x="880"  y="129">numéricas</text>

  <rect class="caixa" x="1100" y="50" width="280" height="110" rx="18" fill="#FFF4E0" stroke="#D98E04"/>
  <text class="t" x="1240" y="95">Transformer</text>
  <text class="t" x="1240" y="129">+ atenção</text>

  <!-- Linha de baixo (lida da direita para a esquerda) -->
  <rect class="caixa" x="1100" y="290" width="280" height="110" rx="18" fill="#FFF4E0" stroke="#D98E04"/>
  <text class="t" x="1240" y="355">Probabilidades</text>

  <rect class="caixa" x="740"  y="290" width="280" height="110" rx="18" fill="#E6F4EA" stroke="#2E8B57"/>
  <text class="t" x="880"  y="335">Próximo</text>
  <text class="t" x="880"  y="369">token</text>

  <rect class="caixa" x="380"  y="290" width="280" height="110" rx="18" fill="#E6F4EA" stroke="#2E8B57"/>
  <text class="t" x="520"  y="355">Resposta</text>

  <!-- Numeração das etapas -->
  <circle cx="46"   cy="50"  r="19" fill="#374151"/><text class="n" x="46"   y="58">1</text>
  <circle cx="406"  cy="50"  r="19" fill="#374151"/><text class="n" x="406"  y="58">2</text>
  <circle cx="766"  cy="50"  r="19" fill="#374151"/><text class="n" x="766"  y="58">3</text>
  <circle cx="1126" cy="50"  r="19" fill="#374151"/><text class="n" x="1126" y="58">4</text>
  <circle cx="1126" cy="290" r="19" fill="#374151"/><text class="n" x="1126" y="298">5</text>
  <circle cx="766"  cy="290" r="19" fill="#374151"/><text class="n" x="766"  y="298">6</text>
  <circle cx="406"  cy="290" r="19" fill="#374151"/><text class="n" x="406"  y="298">7</text>

  <!-- Legenda -->
  <rect x="497" y="544" width="22" height="22" rx="4" fill="#E8F0FE" stroke="#4A78C2" stroke-width="2.5"/>
  <text class="leg" x="529" y="562">Entrada</text>
  <rect x="657" y="544" width="22" height="22" rx="4" fill="#FFF4E0" stroke="#D98E04" stroke-width="2.5"/>
  <text class="leg" x="689" y="562">Modelo</text>
  <rect x="817" y="544" width="22" height="22" rx="4" fill="#E6F4EA" stroke="#2E8B57" stroke-width="2.5"/>
  <text class="leg" x="849" y="562">Saída</text>
</svg>
